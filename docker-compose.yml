services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3999:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smart-agent.rule=Host(`analytical-engine.data-style.com`)"
      - "traefik.http.routers.smart-agent.entrypoints=websecure"
      - "traefik.http.routers.smart-agent.tls=true"
      - "traefik.http.routers.smart-agent.tls.certresolver=myresolver"
      - "traefik.http.services.smart-agent.loadbalancer.server.port=3000"

networks:
  traefik-net:
      external: true
      name: rca-noc-nextjs_traefik-net